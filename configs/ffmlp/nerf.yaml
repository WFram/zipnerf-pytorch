density:
  xyz_encoding_config:
    otype: HashGrid
    n_features_per_level: 1
    log2_hashmap_size: 21
    base_resolution: 16
    per_level_scale: 2
  mlp_network_config:
    otype: FullyFusedMLP
    activation: ReLU
    output_activation: none
    n_neurons: 64
    n_hidden_layers: 1
rgb:
  dir_encoding_config:
    otype: SphericalHarmonics
    degree: 4
  mlp_network_config:
    otype: FullyFusedMLP
    activation: ReLU
    output_activation: Sigmoid
    n_neurons: 128
    n_hidden_layers: 2